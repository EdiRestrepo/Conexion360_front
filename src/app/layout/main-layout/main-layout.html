<div
  class="shell"
  [class.shell--sidebar-collapsed]="sidebarCollapsed()"
  [class.shell--detail-from-dashboard]="detailOrigin() === 'dashboard'"
  [class.shell--detail-from-history]="detailOrigin() === 'history'"
>

  <div class="shell__sidebar-frame">
    <app-sidebar class="shell__sidebar" [session]="session()" [collapsed]="sidebarCollapsed()" (logout)="logout()" />
    <button
      class="shell__sidebar-toggle"
      type="button"
      [attr.aria-label]="sidebarCollapsed() ? 'Mostrar menú lateral' : 'Ocultar menú lateral'"
      [attr.title]="sidebarCollapsed() ? 'Mostrar menú lateral' : 'Ocultar menú lateral'"
      [attr.aria-expanded]="!sidebarCollapsed()"
      (click)="toggleSidebar()"
    >
      <mat-icon aria-hidden="true">{{ sidebarCollapsed() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
    </button>
  </div>
  <div class="shell__body">
    <app-header
      [session]="session()"
      [loading]="(isLoading$ | async) ?? false"
      [hasError]="(authError$ | async) !== null"
      (menuToggle)="openMobileNavigation()"
      (logout)="logout()"
    />
    <main class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </div>

  <app-mobile-navigation
    [open]="mobileNavigationOpen()"
    [session]="session()"
    (closed)="closeMobileNavigation()"
    (logout)="logout()"
  />

  <nav class="shell__bottom-nav" aria-label="Navegación rápida">
    @let unreadCount = (unreadCount$ | async) ?? 0;
    @for (item of bottomNavItems; track item.route) {
      @let showBadge = item.route === '/notifications' && unreadCount > 0;
      <a
        class="shell__bottom-link"
        [routerLink]="item.route"
        routerLinkActive="shell__bottom-link--active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.aria-label]="showBadge ? item.label + ', ' + unreadCount + ' sin leer' : item.label"
      >
        <span class="shell__bottom-icon">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          @if (showBadge) {
            <span class="shell__bottom-badge" aria-hidden="true">{{ unreadCount }}</span>
          }
        </span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
