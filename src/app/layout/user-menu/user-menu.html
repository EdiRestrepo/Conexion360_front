<section class="user-menu" [class.user-menu--compact]="compact()" aria-label="Perfil de usuario">
  @if (compact()) {
    <a mat-icon-button class="user-menu__bell" routerLink="/notifications" aria-label="Ver notificaciones">
      <mat-icon aria-hidden="true">notifications</mat-icon>
      @if (unreadCount$ | async; as unreadCount) {
        @if (unreadCount > 0) {
          <span class="user-menu__badge" aria-label="Notificaciones no leídas">{{ unreadCount }}</span>
        }
      }
    </a>
  }

  <button
    mat-icon-button
    class="user-menu__trigger"
    type="button"
    [matMenuTriggerFor]="userMenuPanel"
    [attr.aria-label]="'Cuenta de ' + displayName()"
  >
    @if (showPicture()) {
      <!-- `no-referrer` evita el 429 de lh3.googleusercontent.com: Google
           limita con dureza las fotos de perfil pedidas desde otro origen
           cuando la petición lleva referrer. -->
      <img
        class="user-menu__avatar"
        [src]="picture() ?? ''"
        alt=""
        aria-hidden="true"
        referrerpolicy="no-referrer"
        (error)="onPictureError()"
      />
    } @else {
      <span class="user-menu__avatar" aria-hidden="true">{{ initials() }}</span>
    }
  </button>

  @if (showIdentity()) {
    <span class="user-menu__identity" aria-hidden="true">
      <strong [title]="displayName()">{{ displayName() }}</strong>
      <small [title]="roleLabel()">{{ roleLabel() }}</small>
    </span>
  }
</section>

<mat-menu #userMenuPanel="matMenu" xPosition="before">
  <div class="user-menu__panel-identity">
    <strong [title]="displayName()">{{ displayName() }}</strong>
    <small [title]="email()">{{ email() }}</small>
    <small>{{ roleLabel() }}</small>
  </div>

  <button mat-menu-item type="button" (click)="onLogout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
