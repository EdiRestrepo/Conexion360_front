<section class="master-list" [attr.aria-labelledby]="headingId()" [attr.aria-busy]="state() === 'loading'">
  <header class="master-list__header">
    <h4 [id]="headingId()">{{ heading() }}</h4>
    @if (state() === 'success') {
      <span class="master-list__count" [attr.aria-label]="count() + ' registros'">{{ count() }}</span>
    }
  </header>

  @switch (state()) {
    @case ('loading') {
      <p class="master-list__status">Cargando...</p>
    }
    @case ('empty') {
      <p class="master-list__status">{{ emptyMessage() }}</p>
    }
    @case ('error') {
      <div class="master-list__status master-list__status--error" role="alert">
        <span>{{ errorMessage() }}</span>
        <button mat-button type="button" (click)="retry.emit()">Reintentar</button>
      </div>
    }
    @default {
      <ng-content />
    }
  }
</section>
