name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para calcular el "new code".
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: |
          # Las URL no llevan espacios: se quitan los que se cuelen al pegar la
          # variable en GitHub (un salto de línea final rompe el `sed` de abajo).
          APP_URL="$(printf '%s' "${{ vars.APP_URL }}" | tr -d '[:space:]')"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          API_BASE_URL="$(printf '%s' "${{ vars.API_BASE_URL }}" | tr -d '[:space:]')"
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="/api/v1"
          fi

          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            auth0: {
              domain: '${{ vars.AUTH0_DOMAIN }}',
              clientId: '${{ vars.AUTH0_CLIENT_ID }}',
              audience: '${{ vars.AUTH0_AUDIENCE }}',
              scope: 'openid profile email',
            },
            api: {
              baseUrl: '__API_BASE_URL__',
            },
            session: {
              idleTimeoutMinutes: 15,
              warningSeconds: 20,
            },
            appUrl: '__APP_URL__',
            appName: 'Conexión360',
          };
          EOF
          sed -i "s|__APP_URL__|$APP_URL|g" src/environments/environment.ts
          sed -i "s|__API_BASE_URL__|$API_BASE_URL|g" src/environments/environment.ts

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      # Config en `sonar-project.properties`. Exige tener apagado el Automatic
      # Analysis del proyecto en SonarCloud. `continue-on-error`: una caída de
      # SonarCloud no debe bloquear el despliegue.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # `/` y no `/<repo>/`: el sitio se sirve desde la raíz del dominio propio
      # (`public/CNAME`). Con la ruta del repositorio, el HTML buscaría el JS y
      # el CSS en `conexion360.space/Conexion360_front/` y la página saldría en
      # blanco: Angular los referencia relativos al `<base href>`.
      - name: Build production bundle
        run: npx ng build --configuration production --base-href "/"

      - name: Prepare SPA fallback
        run: cp dist/conexion360-front/browser/index.html dist/conexion360-front/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/conexion360-front/browser

      - name: Create Nginx environment file
        run: |
          NGINX_API_BASE_URL="$(printf '%s' "${{ vars.NGINX_API_BASE_URL }}" | tr -d '[:space:]')"
          if [ -z "$NGINX_API_BASE_URL" ]; then
            NGINX_API_BASE_URL="$(printf '%s' "${{ vars.API_BASE_URL }}" | tr -d '[:space:]')"
          fi
          if [ -z "$NGINX_API_BASE_URL" ]; then
            NGINX_API_BASE_URL="/api/v1"
          fi

          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            auth0: {
              domain: '${{ vars.AUTH0_DOMAIN }}',
              clientId: '${{ vars.AUTH0_CLIENT_ID }}',
              audience: '${{ vars.AUTH0_AUDIENCE }}',
              scope: 'openid profile email',
            },
            api: {
              baseUrl: '__NGINX_API_BASE_URL__',
            },
            session: {
              idleTimeoutMinutes: 15,
              warningSeconds: 20,
            },
            appUrl: '${{ vars.NGINX_APP_URL }}',
            appName: 'Conexión360',
          };
          EOF
          sed -i "s|__NGINX_API_BASE_URL__|$NGINX_API_BASE_URL|g" src/environments/environment.ts

      - name: Build Nginx distribution bundle
        run: npx ng build --configuration production --base-href "/" --output-path dist/nginx-package

      - name: Upload Nginx distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: conexion360-nginx-dist
          path: dist/nginx-package/browser
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
