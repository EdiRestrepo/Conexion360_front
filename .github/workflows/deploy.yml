name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: |
          APP_URL="${{ vars.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            auth0: {
              domain: '${{ vars.AUTH0_DOMAIN }}',
              clientId: '${{ vars.AUTH0_CLIENT_ID }}',
              audience: '${{ vars.AUTH0_AUDIENCE }}',
              scope: 'openid profile email',
            },
            api: {
              baseUrl: '/api/v1',
              homeClientId: '',
              homeRole: '',
            },
            appUrl: '__APP_URL__',
            appName: 'Conexion360',
          };
          EOF
          sed -i "s|__APP_URL__|$APP_URL|g" src/environments/environment.ts

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare SPA fallback
        run: cp dist/seguimiento-envios/browser/index.html dist/seguimiento-envios/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/seguimiento-envios/browser

      - name: Create Nginx environment file
        run: |
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            auth0: {
              domain: '${{ vars.AUTH0_DOMAIN }}',
              clientId: '${{ vars.AUTH0_CLIENT_ID }}',
              audience: '${{ vars.AUTH0_AUDIENCE }}',
              scope: 'openid profile email',
            },
            api: {
              baseUrl: '/api/v1',
              homeClientId: '',
              homeRole: '',
            },
            appUrl: '${{ vars.NGINX_APP_URL }}',
            appName: 'Conexion360',
          };
          EOF

      - name: Build Nginx distribution bundle
        run: npx ng build --configuration production --base-href "/" --output-path dist/nginx-package

      - name: Create Nginx ZIP package
        run: |
          cd dist/nginx-package/browser
          zip -r ../../conexion360-nginx-dist.zip .

      - name: Upload Nginx ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: conexion360-nginx-dist
          path: dist/conexion360-nginx-dist.zip
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
